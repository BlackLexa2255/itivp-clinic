name: CI/CD

# Фронтенд собирает и публикует Vercel сам при push в kr22, здесь только бекенд

on:
  push:
    branches: [kr22]
  workflow_dispatch:

jobs:
  test:
    name: Линтинг и тесты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Установка зависимостей
        run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Тесты Jest
        run: npm test

  deploy-backend:
    name: Деплой бекенда на Render
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Запуск деплоя через Render API
        run: |
          curl -fsS -X POST "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" -d '{"commitId":"${{ github.sha }}"}'

  notify:
    name: Уведомление в Telegram
    needs: [test, deploy-backend]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Отправка статуса сборки
        run: |
          curl -fsS -o /dev/null "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            --data-urlencode text="${{ contains(needs.*.result, 'failure') && '❌ Сборка завершилась с ошибкой' || '✅ Сборка и деплой прошли успешно' }}
          Ветка: ${{ github.ref_name }}
          Тесты: ${{ needs.test.result }}, бекенд: ${{ needs.deploy-backend.result }}
          ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
